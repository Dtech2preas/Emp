name: Build Debug APK

on:
  # Trigger only on the specific branch from your screenshot
  push:
    branches: [ "apkinspector-init-14674820147306739622" ]
  pull_request:
    branches: [ "apkinspector-init-14674820147306739622" ]
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      # I added -Xmx2048m here to prevent the "Java heap space" error you saw earlier
      run: ./gradlew assembleDebug --stacktrace -Dorg.gradle.jvmargs=-Xmx2048m

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: debug-apk
        path: app/build/outputs/apk/debug/*.apk
